# ============================================================
# BLETIA · Directivas recomendadas para CloudPanel → Vhost
# (copiar el contenido dentro del bloque server de tu sitio)
# No es obligatorio: el sitio funciona sin esto, pero mejora
# velocidad, caché y seguridad.
# ============================================================

# Compresión
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_vary on;

# Cabeceras de seguridad
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Cacheo agresivo de los assets con hash (cambian en cada build)
location ~* \.(js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# El index.html siempre fresco (es el que sabe qué assets cargar)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Rutas con #/ no llegan al servidor, así que no hace falta try_files.
# (Si algún día pasas a rutas limpias /producto/x, descomenta:)
# location / { try_files $uri $uri/ /index.html; }
