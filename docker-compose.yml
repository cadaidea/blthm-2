version: '3.8'

services:
  # ============================================
  # BASE DE DATOS POSTGRESQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: bletia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bletia
      POSTGRES_PASSWORD: bletia_password
      POSTGRES_DB: bletia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bletia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bletia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND API (Fastify)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bletia-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bletia:bletia_password@postgres:5432/bletia_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secret-en-produccion-usa-openssl-rand-base64-32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bletia-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # FRONTEND (React + Vite) - Solo desarrollo
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bletia-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - bletia-network
    profiles:
      - dev

# ============================================
# VOLÚMENES
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# REDES
# ============================================
networks:
  bletia-network:
    driver: bridge
